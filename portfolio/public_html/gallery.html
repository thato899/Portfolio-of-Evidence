<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Project Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fafafa;
            color: #1a1a1a;
        }
        .gallery-card {
            background: white;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .gallery-card:hover {
            border-color: #a0a0a0;
            transform: translateY(-2px);
        }
        .modal {
            background: rgba(0, 0, 0, 0.85);
        }
        .modal-content {
            background: white;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .btn-close {
            background: #2d2d2d;
            color: white;
            padding: 0.5rem 1.5rem;
        }
        .btn-close:hover {
            background: #000000;
        }
        .btn-link {
            background: #2d2d2d;
            color: white;
            padding: 0.75rem 1.5rem;
            display: inline-block;
            text-decoration: none;
        }
        .btn-link:hover {
            background: #000000;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #d4d4d4;
            padding: 0.5rem 1rem;
            color: #4a4a4a;
        }
        .filter-btn.active {
            background: #2d2d2d;
            color: white;
            border-color: #2d2d2d;
        }
        .filter-btn:hover:not(.active) {
            border-color: #000000;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="max-w-7xl mx-auto px-4 py-12">
        <header class="border-b border-gray-200 pb-8 mb-8">
            <a href="/" class="text-gray-600 hover:text-black inline-block mb-4">&larr; Back to Portfolio</a>
            <h1 class="text-4xl font-light tracking-tight">Project Gallery</h1>
            <p class="text-gray-600 mt-2">Each image tells a story. Click to read more.</p>
        </header>

        <div class="mb-8 flex flex-wrap gap-3">
            <button class="filter-btn active" data-filter="all">All Stories</button>
            <button class="filter-btn" data-filter="project">By Project</button>
        </div>

        <div id="gallery-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="gallery-card p-8 text-center text-gray-500">Loading gallery...</div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal fixed inset-0 hidden items-center justify-center z-50 p-4">
        <div class="modal-content rounded-lg p-6 md:p-8">
            <img id="modal-image" src="" alt="" class="w-full mb-6 rounded">
            <h3 id="modal-title" class="text-xl font-medium mb-3"></h3>
            <p id="modal-story" class="text-gray-700 leading-relaxed mb-6"></p>
            <div class="flex justify-between items-center">
                <a id="modal-link" href="#" target="_blank" class="btn-link rounded">View Related Link</a>
                <button onclick="closeModal()" class="btn-close rounded">Close</button>
            </div>
        </div>
    </div>

    <script>
        let allImages = [];

        async function loadGallery() {
            try {
                const response = await fetch('/api/gallery.php');
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    allImages = result.data;
                    renderGallery(allImages);
                } else {
                    document.getElementById('gallery-container').innerHTML = `
                        <div class="gallery-card p-8 text-center text-gray-500 col-span-full">
                            No stories added yet. Check back soon.
                        </div>
                    `;
                }
            } catch(error) {
                console.error('Error loading gallery:', error);
                document.getElementById('gallery-container').innerHTML = `
                    <div class="gallery-card p-8 text-center text-red-600 col-span-full">
                        Error loading gallery. Please try again later.
                    </div>
                `;
            }
        }

        function renderGallery(images) {
            if (images.length === 0) {
                document.getElementById('gallery-container').innerHTML = `
                    <div class="gallery-card p-8 text-center text-gray-500 col-span-full">
                        No images match the selected filter.
                    </div>
                `;
                return;
            }

            const galleryHtml = images.map(img => `
                <div class="gallery-card overflow-hidden" onclick="openModal(${JSON.stringify(img).replace(/"/g, '&quot;')})">
                    <img src="${img.image_url}" alt="${img.project_title}" class="w-full h-64 object-cover">
                    <div class="p-5">
                        <p class="text-xs text-gray-400 uppercase tracking-wide mb-2">${img.project_title}</p>
                        <p class="text-gray-700 line-clamp-3 text-sm leading-relaxed">${escapeHtml(img.story.substring(0, 120))}${img.story.length > 120 ? '...' : ''}</p>
                        ${img.hyperlink ? '<p class="text-gray-400 text-xs mt-3">Contains external link</p>' : ''}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('gallery-container').innerHTML = galleryHtml;
        }

        function openModal(image) {
            document.getElementById('modal-image').src = image.image_url;
            document.getElementById('modal-title').textContent = image.project_title;
            document.getElementById('modal-story').textContent = image.story;
            
            const linkButton = document.getElementById('modal-link');
            if (image.hyperlink && image.hyperlink !== '') {
                linkButton.href = image.hyperlink;
                linkButton.style.display = 'inline-block';
            } else {
                linkButton.style.display = 'none';
            }
            
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const filter = this.getAttribute('data-filter');
                if (filter === 'all') {
                    renderGallery(allImages);
                }
            });
        });

        loadGallery();

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
